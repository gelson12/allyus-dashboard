<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0 on notched iPhones. The stylesheet already positions
         the assistant FAB and the ceremony skip button off those insets;
         without this they quietly sat in the home-indicator gesture strip. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      SEO baseline. This file is the ONLY server-rendered HTML the app has —
      everything else is client-rendered, so a crawler that does not run
      JavaScript sees exactly this and nothing else. So the title and
      description describe the PRODUCT, not whichever route is open.

      The previous title was "ALLYUS — Operator Console": what we call it
      internally, and a phrase nobody searches for.
    -->
    <title>Sign in — ALLYUS</title>
    <meta
      name="description"
      content="Sign in to your ALLYUS dashboard."
    />
    <link rel="canonical" href="https://a-l-l-y.com/login" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALLYUS" />
    <meta property="og:url" content="https://a-l-l-y.com/login" />
    <meta property="og:title" content="Sign in — ALLYUS" />
    <meta
      property="og:description"
      content="Sign in to your ALLYUS dashboard."
    />
    <!-- A card with the name and the line on it, not the bare mark: a
         transparent 845x346 logo composited on white by Facebook and on
         black by X is a squiggle with no product name. Dimensions are
         declared so the first share of any URL is not rendered without
         an image while the scraper fetches it asynchronously. -->
    <meta property="og:image" content="https://a-l-l-y.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ALLYUS — intelligence that grows with you" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sign in — ALLYUS" />
    <meta
      name="twitter:description"
      content="Sign in to your ALLYUS dashboard."
    />
    <meta name="twitter:image" content="https://a-l-l-y.com/og-card.png" />

    <!--
      Structured data. Organization gives search engines a stable identity to
      hang a logo and sitelinks on; SoftwareApplication describes the product.
      The prices mirror plan-catalog.ts — if that ladder moves, move these too,
      because a stale price in structured data is a claim we are not honouring.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://a-l-l-y.com/#organization",
            "name": "ALLYUS",
            "url": "https://a-l-l-y.com/",
            "logo": "https://a-l-l-y.com/allyus-logo.png",
            "description": "The all-in-one platform for local businesses: an AI that answers customers and books appointments 24/7, with bookings, invoices, stock and records in one place."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://a-l-l-y.com/#software",
            "name": "ALLYUS",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://a-l-l-y.com/",
            "publisher": { "@id": "https://a-l-l-y.com/#organization" },
            "offers": [
              { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "GBP", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "0", "priceCurrency": "GBP", "billingIncrement": 1, "unitCode": "MON" } },
              { "@type": "Offer", "name": "Essentials", "price": "49", "priceCurrency": "GBP", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "49", "priceCurrency": "GBP", "billingIncrement": 1, "unitCode": "MON" } },
              { "@type": "Offer", "name": "Professional", "price": "99", "priceCurrency": "GBP", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "99", "priceCurrency": "GBP", "billingIncrement": 1, "unitCode": "MON" } },
              { "@type": "Offer", "name": "Autopilot", "price": "199", "priceCurrency": "GBP", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "199", "priceCurrency": "GBP", "billingIncrement": 1, "unitCode": "MON" } }
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://a-l-l-y.com/#faq",
            "mainEntity": [
              { "@type": "Question", "name": "Will it sound like a robot to my customers?", "acceptedAnswer": { "@type": "Answer", "text": "It answers in your language, from your own prices and policies, and hands over to you the moment something needs a human. You set the tone, and you can read every conversation it has had." } },
              { "@type": "Question", "name": "What if it gets something wrong?", "acceptedAnswer": { "@type": "Answer", "text": "The things that would hurt to get wrong — money, cancellations, anything leaving your business — are drafted for you and wait for your approval. Bookings it makes are real, and you can move or cancel any of them." } },
              { "@type": "Question", "name": "Do I need a website already?", "acceptedAnswer": { "@type": "Answer", "text": "No. ALLYUS builds you one, shaped around your trade, and Ally lives on it. If you already have a site, it can read yours and fill the new one in from it." } },
              { "@type": "Question", "name": "What happens when I'm on holiday?", "acceptedAnswer": { "@type": "Answer", "text": "Ally keeps answering and keeps taking bookings against the hours you set. Anything waiting for your approval is still waiting when you get back, and nothing went out without you." } },
              { "@type": "Question", "name": "Can I take over a conversation myself?", "acceptedAnswer": { "@type": "Answer", "text": "Yes, at any point. Every conversation is in your dashboard as it happens, and you can step in and type. Ally steps back when you do." } },
              { "@type": "Question", "name": "What does it cost me to try?", "acceptedAnswer": { "@type": "Answer", "text": "Nothing. Every account opens on fourteen days of Professional with no card. When that ends you drop to the Free plan and carry on — you are not locked out of your own site or your own bookings." } }
            ]
          }
        ]
      }
    </script>

    <!--
      Verification + analytics slots, deliberately EMPTY.
      These need accounts only the owner can create, and inventing an ID would
      have the page claim a property we do not own. docs/SEO_SETUP.md has the
      exact steps; paste the tokens here and rebuild.
    -->
    <!-- google-site-verification: paste the content value here once issued -->
    <!-- msvalidate.01: paste the Bing value here once issued -->

    <!--
      ANALYTICS. One line, then the funnel is measurable.

      src/lib/track.ts already fires named events at every moment that
      matters on the marketing pages - hero CTAs, whether the demo was
      played, whether an option was actually clicked, whether the visitor
      ever reached the price, FAQ opened, final CTA, sticky CTA. Every one
      of them is a NO-OP until a vendor is loaded here, so nothing is being
      recorded today and no one can yet say whether the rebuild converts
      better than what it replaced.

      Uncomment ONE of these once the account exists. Both are cookieless
      and neither needs a consent banner, which is why they were chosen over
      Google Analytics.

      Plausible (plausible.io):
        <script defer data-domain="a-l-l-y.com"
                src="https://plausible.io/js/script.tagged-events.js"></script>

      Umami (umami.is or self-hosted):
        <script defer data-website-id="PASTE-ID"
                src="https://YOUR-UMAMI-HOST/script.js"></script>

      track() detects whichever is present. Nothing else needs changing.
      NOTE: the Content-Security-Policy, if one is ever added, must allow the
      chosen host or the script will load silently as nothing.
    -->
    <script type="module" crossorigin src="/assets/index-B-9VztQ0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BCrNQt9r.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
