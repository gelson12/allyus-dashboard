# Pages deploys from Actions, not the legacy Jekyll builder.
#
# Two things keep breaking this repo, so both are guarded here:
#   1. A publish that lands without .nojekyll makes the legacy builder try to
#      run Jekyll over a Vite bundle — it errors, or hangs for 40+ minutes.
#   2. A publish that mirrors dist/ over the repo root can delete this file,
#      which silently stops every deploy. The verify step below fails loudly
#      instead, and .nojekyll is restored from the build.
#
# When publishing by hand: copy dist/ in WITHOUT removing .github/, and make
# sure .nojekyll survives (apps/web/public/.nojekyll ships it).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the publish is intact
        run: |
          test -f index.html || { echo "::error::index.html missing"; exit 1; }
          test -f CNAME || { echo "::error::CNAME missing — the custom domain would drop"; exit 1; }
          test -d assets || { echo "::error::assets/ missing"; exit 1; }
          # Belt and braces: Pages must never run Jekyll over the bundle.
          touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
