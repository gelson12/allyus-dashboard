<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0 on notched iPhones. The stylesheet already positions
         the assistant FAB and the ceremony skip button off those insets;
         without this they quietly sat in the home-indicator gesture strip. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      SEO baseline. This file is the ONLY server-rendered HTML the app has —
      everything else is client-rendered, so a crawler that does not run
      JavaScript sees exactly this and nothing else. So the title and
      description describe the PRODUCT, not whichever route is open.

      The previous title was "ALLYUS — Operator Console": what we call it
      internally, and a phrase nobody searches for.
    -->
    <title>ALLYUS — the AI employee for local businesses</title>
    <meta
      name="description"
      content="Your first employee who never sleeps. ALLYUS answers your customers, books real appointments and keeps your business moving 24/7 — a website, online bookings, customer records and an AI receptionist, for 32 local trades. Start free, no card required."
    />
    <link rel="canonical" href="https://a-l-l-y.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALLYUS" />
    <meta property="og:url" content="https://a-l-l-y.com/" />
    <meta property="og:title" content="ALLYUS — your first employee who never sleeps" />
    <meta
      property="og:description"
      content="Ally answers your customers, handles enquiries and books appointments 24/7 — without another salary, training burden or missed enquiry. Free plan, no card required."
    />
    <meta property="og:image" content="https://a-l-l-y.com/allyus-logo.png" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ALLYUS — your first employee who never sleeps" />
    <meta
      name="twitter:description"
      content="Answers your customers and books real appointments, 24/7. Free plan, no card required."
    />
    <meta name="twitter:image" content="https://a-l-l-y.com/allyus-logo.png" />

    <!--
      Structured data. Organization gives search engines a stable identity to
      hang a logo and sitelinks on; SoftwareApplication describes the product.
      The prices mirror plan-catalog.ts — if that ladder moves, move these too,
      because a stale price in structured data is a claim we are not honouring.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://a-l-l-y.com/#organization",
            "name": "ALLYUS",
            "url": "https://a-l-l-y.com/",
            "logo": "https://a-l-l-y.com/allyus-logo.png",
            "description": "An AI employee for local service businesses — website, bookings, customer records and a 24/7 AI receptionist."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://a-l-l-y.com/#software",
            "name": "ALLYUS",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://a-l-l-y.com/",
            "publisher": { "@id": "https://a-l-l-y.com/#organization" },
            "offers": [
              { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "GBP" },
              { "@type": "Offer", "name": "Essentials", "price": "49", "priceCurrency": "GBP" },
              { "@type": "Offer", "name": "Professional", "price": "99", "priceCurrency": "GBP" },
              { "@type": "Offer", "name": "Autopilot", "price": "199", "priceCurrency": "GBP" }
            ]
          }
        ]
      }
    </script>

    <!--
      Verification + analytics slots, deliberately EMPTY.
      These need accounts only the owner can create, and inventing an ID would
      have the page claim a property we do not own. docs/SEO_SETUP.md has the
      exact steps; paste the tokens here and rebuild.
    -->
    <!-- google-site-verification: paste the content value here once issued -->
    <!-- msvalidate.01: paste the Bing value here once issued -->

    <!--
      ANALYTICS. One line, then the funnel is measurable.

      src/lib/track.ts already fires named events at every moment that
      matters on the marketing pages - hero CTAs, whether the demo was
      played, whether an option was actually clicked, whether the visitor
      ever reached the price, FAQ opened, final CTA, sticky CTA. Every one
      of them is a NO-OP until a vendor is loaded here, so nothing is being
      recorded today and no one can yet say whether the rebuild converts
      better than what it replaced.

      Uncomment ONE of these once the account exists. Both are cookieless
      and neither needs a consent banner, which is why they were chosen over
      Google Analytics.

      Plausible (plausible.io):
        <script defer data-domain="a-l-l-y.com"
                src="https://plausible.io/js/script.tagged-events.js"></script>

      Umami (umami.is or self-hosted):
        <script defer data-website-id="PASTE-ID"
                src="https://YOUR-UMAMI-HOST/script.js"></script>

      track() detects whichever is present. Nothing else needs changing.
      NOTE: the Content-Security-Policy, if one is ever added, must allow the
      chosen host or the script will load silently as nothing.
    -->
    <script type="module" crossorigin src="/assets/index-6gFLvU7e.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DYFez_P9.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
