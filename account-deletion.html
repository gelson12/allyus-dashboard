      The previous title was "ALLYUS — Operator Console": what we call it

    <!--
      Verification slots, deliberately EMPTY.
      These need accounts only the owner can create, and inventing an ID would
      have the page claim a property we do not own. docs/SEO_OWNER_SETUP.md has
      the exact steps; paste the tokens here and rebuild.

      THE GOOGLE ONE IS STILL THE WHOLE GAME. Measured 2026-10-12: a `site:`
      search for this domain returned NOTHING. Nothing blocks indexing - robots,
      sitemap, canonical, meta robots, the www 301 and the per-page <noscript>
      bodies are all correct and were checked against the live site. The domain
      had simply never been DISCOVERED, and Search Console is the only way to
      tell Google so, because it needs the owner's own account.

      THE BING ONE IS NOW OPTIONAL. Since #398 the deploy submits every sitemap
      URL to IndexNow (proven: `indexnow: submitting 9 URLs` / `HTTP 202`, with
      the ownership key file answering 200 at its own name), which is what gets
      pages INTO Bing - and therefore into DuckDuckGo and ChatGPT search. A Bing
      Webmaster account would add a dashboard, not a submission. Left here for
      whoever wants the dashboard; nothing is waiting on it.
    -->
    <!--
      GOOGLE IS VERIFIED BY FILE, NOT BY THIS TAG. The owner chose the
      "HTML file" method on 2026-10-13, so the proof is
      apps/web/public/googlef00cab4581a72d1f.html - which must NEVER be
      deleted, per Google's own warning, and is pinned by
      apps/api/src/website/indexnow-site-key.spec.ts. This slot stays empty
      and stays here: a second property, or a re-verification offered only as
      a meta tag, would land in it.
    -->
    <!-- google-site-verification: verified by file; see the note above -->
    <!-- msvalidate.01: optional, see above - Bing submission is automatic -->

    <!--
      ANALYTICS: NOT HERE, ON PURPOSE.

      This shell serves the WHOLE app. It is "/" and the public pages, but
      it is also 404.html - the byte-copy GitHub Pages serves for every deep
      link, which is how every authenticated route loads - and the base the
      build derives pricing/register/login/demo.html and the legal entry
      points from. A tag in this file would load on /home, /invoices and
      every other page an owner opens inside their own business, and hand
      the page to a third party before any data-include rule could decline
      to REPORT it. The rule decides what is reported, not what is loaded.

      So the Plausible tag is mounted at runtime by the public pages only:
      src/lib/publicAnalytics.ts holds the tag, its scope and the
      off-switch, and src/lib/funnelAnalytics.conformance.test.ts refuses
      any <script> here that names an analytics host, checks that 404.html
      and the entry files stay derived from this file with nothing added,
      and checks that every public page in the funnel mounts it.

      Umami (the alternative track.ts detects) would live in that module
      too, never here. NOTE: the Content-Security-Policy, if one is ever
      added, must allow the chosen host or the script will load silently
      as nothing.
    -->
    <script type="module" crossorigin src="/assets/index-lSd5MOpt.js"></script>
